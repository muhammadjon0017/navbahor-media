};
let lang = localStorage.lang || 'uz';
const t = (k, p = {}) => (L[lang][k] || L.uz[k] || k).replace(/\{(\w+)\}/g, (_, x) => p[x]);
const S = { view: 'home', authMode: 'login', token: localStorage.getItem('token'), me: null, players: [], matches: [], preds: [], board: [], news: [], msg: '', photoMsg: '', newsMsg: '', matchId: null, fanName: '', formation: '4-3-3', slots: Array(11).fill(null), activeSlot: null };
const FORMATION_POSITIONS = ['FWD', 'FWD', 'FWD', 'MID', 'MID', 'MID', 'DEF', 'DEF', 'DEF', 'DEF', 'GK'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const errText = d => t(d.error) || d.error || 'Error';

async function api(url, method = 'GET', body) {
  const headers = {};
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  const options = { method, headers };
  if (body instanceof FormData) {
    options.body = body;
  } else if (body) {
    headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }
  const res = await fetch(url, options);
  const json = await res.json().catch(() => ({ ok: false, error: 'server_error' }));
  return json;
}

function renderLang() {
  const items = ['uz', 'ru', 'en'];
  $('lang').innerHTML = items.map(code => `<button class="${code === lang ? 'on' : ''}" onclick="setLang('${code}')">${code.toUpperCase()}</button>`).join('');
}

function renderNav() {
  const tabs = [['home', '🏠'], ['lineup', '⚽'], ['rank', '🏆'], ['me', '👤']];
  if (S.me && S.me.role === 'admin') tabs.push(['admin', '🛠']);
  $('nav').innerHTML = tabs.map(([key, icon]) => `<button class="${S.view === key ? 'on' : ''}" onclick="go('${key}')">${icon}<br>${t(key)}</button>`).join('');
}

const msg = () => S.msg ? `<div class="msg">${esc(S.msg)}</div>` : '';

function fmt(value) {
  if (!value) return '';
  return new Date(value).toLocaleString(lang === 'uz' ? 'uz-UZ' : lang === 'ru' ? 'ru-RU' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' });
}

function countdown(value) {
  const diff = Math.max(0, new Date(value).getTime() - Date.now());
  const totalSeconds = Math.floor(diff / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  return `${days}d ${hours}h ${minutes}m`;
}

function renderAuth() {
  const reg = S.authMode === 'reg';
  return `
    <div class="card">
      <h2>${reg ? t('register') : t('login')}</h2>
      ${msg()}
      ${reg ? `<input id="fn" placeholder="${t('fullName')}"><input id="un" placeholder="${t('username')}"><input id="em" type="email" placeholder="${t('email')}">` : `<input id="lg" placeholder="${t('loginId')}">`}
      <input id="pw" type="password" placeholder="${t('password')}">
      <button class="btn" onclick="doAuth()">${reg ? t('register') : t('login')}</button>
      <button class="btn alt" onclick="S.authMode = '${reg ? 'login' : 'reg'}'; render()">${reg ? t('login') : t('register')}</button>
    </div>
  `;
}

async function doAuth() {
  const payload = S.authMode === 'reg'
    ? { fullName: $('fn')?.value.trim(), username: $('un')?.value.trim(), email: $('em')?.value.trim(), password: $('pw')?.value }
    : { login: $('lg')?.value.trim(), password: $('pw')?.value };
  const endpoint = S.authMode === 'reg' ? '/api/auth/register' : '/api/auth/login';
  const d = await api(endpoint, 'POST', payload);
  if (!d.ok) {
    S.msg = errText(d);
    render();
    return;
  }
  S.token = d.token;
  localStorage.setItem('token', d.token);
  S.view = 'lineup';
  S.msg = '';
  await load();
}

function renderLineup() {
  if (!S.me) return `<div class="card"><p>${t('login_first')}</p><button class="btn" onclick="go('auth')">${t('login')}</button></div>`;
  const match = S.matches.find(m => m.id === S.matchId) || S.matches[0];

  const mine = match && S.preds.find(p => p.MatchId === match.id);
  if (mine) {
    return `<div class="card"><b>${t('round')} ${match.round}: Navbahor — ${esc(match.opponent)}</b><p class="muted">${t('deadline')}: ${fmt(match.predictionDeadline)}</p><p class="muted">${t('coach')}: Temur Kapadze</p></div><div class="card"><h2>${t('pending')}</h2>${mine.players.map(pp => `<div class="lb"><span>#${pp.Player.jerseyNumber} ${esc(pp.Player.fullName)}</span><span>${pp.isCorrect === true ? '<b class="ok">✔</b>' : pp.isCorrect === false ? '<b class="no">✘</b>' : ''}</span></div>`).join('')}</div>`;
  }

  const selectedCount = (S.slots || []).filter(Boolean).length;
  return `
    <div class="card lineup-match">
      <div><span class="lineup-kicker">⚽ ${t('lineup')} · ${esc(S.formation)}</span>
      ${match ? `<h2>${t('round')} ${match.round}: Navbahor — ${esc(match.opponent)}</h2><p class="muted">${t('deadline')}: ${fmt(match.predictionDeadline)}</p>` : `<h2>${t('lineup')}</h2><p class="muted">${t('none')}</p>`}</div>
    </div>
    ${msg()}
    <div class="card lineup-builder">
      <div class="lineup-toolbar"><div><h2>${t('selectStarting')}</h2><p class="muted">Maydondagi har bir doirani bosib futbolchi tanlang.</p></div><span class="lineup-count">${selectedCount}/11</span></div>
      <div class="pitch">
        <div class="pitch-center"></div><div class="pitch-line"></div>
        ${renderLineupPitch()}
      </div>
      <div class="lineup-actions">
        <span class="muted">${selectedCount === 11 ? 'Tarkib tayyor' : `Yana ${11 - selectedCount} ta futbolchi tanlang`}</span>
        <button class="btn" onclick="submitPred()" ${selectedCount !== 11 || !match ? 'disabled' : ''}>${t('submit')}</button>
      </div>
    </div>
  `;
}

function renderLineupPitch() {
  const groups = [
    { position: 'FWD', count: 3 },
    { position: 'MID', count: 3 },
    { position: 'DEF', count: 4 },
    { position: 'GK', count: 1 }
  ];
  let slotIndex = 0;
  return groups.map(group => `
    <div class="pitch-row">
      ${Array.from({ length: group.count }, () => {
        const index = slotIndex++;
        const playerId = S.slots[index];
        const player = S.players.find(item => item.id === playerId);
        const marker = player
          ? (player.photoUrl ? `<img src="${esc(player.photoUrl)}" alt="">` : `#${player.jerseyNumber}`)
          : '+';
        return `<button class="lineup-position ${player ? 'filled' : 'empty'}" onclick="openPlayerPicker(${index})" aria-label="${t(group.position)}: ${player ? esc(player.fullName) : t('pick')}">
          <span class="lineup-avatar">${marker}</span>
          <span class="lineup-role">${t(group.position)}</span>
          <span class="lineup-name">${player ? esc(player.fullName) : t('pick')}</span>
        </button>`;
      }).join('')}
    </div>
  `).join('');
}

function openPlayerPicker(index) {
  S.activeSlot = index;
  render();
}

function renderPlayerPicker() {
  if (S.activeSlot === null) return '';
  const index = S.activeSlot;
  const position = FORMATION_POSITIONS[index];
  if (!position) return '';
  const players = S.players.filter(player => player.position === position);
  return `
    <div class="modal" onclick="closePlayerPicker()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="picker-heading"><div><h2>${t(position)} · ${t('pick')}</h2><p class="muted">Ushbu pozitsiya uchun futbolchini tanlang.</p></div><button class="picker-close" onclick="closePlayerPicker()" aria-label="Yopish">×</button></div>
        <div class="player-options">
          ${players.map(player => {
            const usedElsewhere = S.slots.some((selectedId, selectedIndex) => selectedIndex !== index && selectedId === player.id);
            return `<button class="player-option" onclick="selectPlayer(${player.id})" ${usedElsewhere ? 'disabled' : ''}>
              <span class="dot">${player.photoUrl ? `<img src="${esc(player.photoUrl)}" alt="">` : `#${player.jerseyNumber}`}</span>
              <span class="player-option-info"><b>${esc(player.fullName)}</b><small>#${player.jerseyNumber} · ${t(player.position)}</small></span>
              ${usedElsewhere ? '<small class="muted">Tanlangan</small>' : ''}
            </button>`;
          }).join('') || `<p class="muted">Bu pozitsiya uchun futbolchi topilmadi.</p>`}
          ${S.slots[index] ? `<button class="btn alt" onclick="clearLineupSlot(${index})">Pozitsiyani bo'shatish</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function closePlayerPicker() {
  S.activeSlot = null;
  render();
}

function selectPlayer(playerId) {
  const index = S.activeSlot;
  if (index === null || S.slots.some((selectedId, selectedIndex) => selectedIndex !== index && selectedId === playerId)) return;
  S.slots[index] = playerId;
  S.activeSlot = null;
  render();
}

function clearLineupSlot(index) {
  S.slots[index] = null;
  S.activeSlot = null;
  render();
}

async function submitPred() {
  if ((S.slots || []).filter(Boolean).length !== 11) {
    S.msg = t('need_11');
    render();
    return;
  }
  const payload = { matchId: S.matchId || S.matches[0].id, formation: S.formation, fanName: S.fanName || S.me.fullName, playerIds: (S.slots || []).filter(Boolean) };
  const d = await api('/api/predictions', 'POST', payload);
  S.msg = d.ok ? t('saved') : errText(d);
  if (d.ok) {
    S.slots = Array(11).fill(null);
    await load();
  }
  render();
}

function renderRank() {
  return `<div class="card"><h2>🏆 ${t('rankTitle')}</h2>${S.board.map((u, i) => `<div class="lb ${i < 3 ? 'r' + (i + 1) : ''}"><span>${i + 1}. ${esc(u.username)}</span><span>✔ ${u.correctPredictions} · <b>💎 ${u.totalDiamonds}</b></span></div>`).join('')}</div>`;
}

        </div>
        <div class="admin-submit">
          <span class="muted">Taxmin muddati o'yin boshlanishidan oldin bo'lishi kerak.</span>
          <button class="btn" onclick="addMatch()">＋ ${t('create')}</button>
        </div>
      </section>
      <section class="admin-panel">
        <div class="admin-panel-heading">
          <div class="admin-panel-icon">📰</div>
          <div><h2>${t('publishNews')}</h2><p>Sayt bosh sahifasidagi yangiliklarni shu yerdan qo‘shing.</p></div>
        </div>
        ${S.newsMsg ? `<div class="msg">${esc(S.newsMsg)}</div>` : ''}
        <div class="admin-news-form">
          <div class="admin-field"><label for="news-title">${t('newsTitle')}</label><input id="news-title" maxlength="200" placeholder="${t('newsTitle')}"></div>
          <div class="admin-field"><label for="news-body">${t('newsBody')}</label><textarea id="news-body" placeholder="${t('newsBody')}"></textarea></div>
          <div class="admin-field"><label for="news-image">${t('photo')} (ixtiyoriy)</label><input id="news-image" type="file" accept="image/png,image/jpeg,image/webp"></div>
          <div class="admin-submit"><span class="muted">Rasm ixtiyoriy; PNG, JPG yoki WEBP, 3 MB gacha.</span><button class="btn" onclick="addNews()">＋ ${t('save')}</button></div>
        </div>
        <div class="admin-news-list">
          <h2>${t('news')} (${S.news.length})</h2>
          ${S.news.map(item => `<article class="admin-news-item">
            ${item.imageUrl ? `<img class="admin-news-thumb" src="${esc(item.imageUrl)}" alt="">` : `<span class="admin-news-thumb"></span>`}
            <div class="admin-news-copy"><b>${esc(item.title)}</b><p>${esc(item.body)}</p><small>${fmt(item.createdAt)}</small></div>
            <button class="btn alt" onclick="deleteNews(${item.id})">${t('delNews')}</button>
          </article>`).join('') || `<p class="muted">${t('newsEmpty')}</p>`}
        </div>
      </section>
      <section class="admin-panel">
        <div class="admin-panel-heading">
          <div class="admin-panel-icon">📷</div>
          <div><h2>Futbolchilar rasmlari</h2><p>PNG, JPG yoki WEBP formatida, har biri 3 MB gacha.</p></div>
        </div>
        ${S.photoMsg ? `<div class="msg">${esc(S.photoMsg)}</div>` : ''}
        <div class="roster-grid">
          ${S.players.map(player => `<article class="roster-player">
            <span class="roster-avatar">${player.photoUrl ? `<img src="${esc(player.photoUrl)}" alt="">` : `#${player.jerseyNumber}`}</span>
            <span class="roster-info"><b>${esc(player.fullName)}</b><small>#${player.jerseyNumber} · ${t(player.position)}</small></span>
            <label class="photo-upload">${player.photoUrl ? 'Rasmni almashtirish' : 'Rasm yuklash'}
              <input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadPlayerPhoto(${player.id}, this.files[0])">
            </label>
          </article>`).join('')}
        </div>
      </section>
      <div class="muted" style="text-align:center;padding:2px 0 8px">⚽ PFCNAVBAHOR_ · Admin panel</div>
      </div>
  `;
}

async function uploadPlayerPhoto(playerId, file) {
  if (!file) return;
  const formData = new FormData();
  formData.append('photo', file);
  const result = await api(`/api/admin/players/${playerId}`, 'PUT', formData);
  S.photoMsg = result.ok ? 'Futbolchi rasmi yuklandi.' : errText(result);
  if (result.ok) {
    await load();
  } else {
    render();
  }
}

async function addNews() {
  const title = $('news-title').value.trim();
  const body = $('news-body').value.trim();
  if (!title || !body) {
    S.newsMsg = t('invalid_input');
    render();
    return;
  }

  const formData = new FormData();
  formData.append('title', title);
  formData.append('body', body);
  const image = $('news-image').files[0];
  if (image) formData.append('image', image);
  const result = await api('/api/admin/news', 'POST', formData);
  S.newsMsg = result.ok ? t('done') : errText(result);
  if (result.ok) {
    await load();
  } else {
    render();
  }
}

async function deleteNews(id) {
  if (!confirm('Yangilikni o‘chirmoqchimisiz?')) return;
  const result = await api(`/api/admin/news/${id}`, 'DELETE');
  S.newsMsg = result.ok ? t('done') : errText(result);
  if (result.ok) {
    await load();
  } else {
    render();
  }
}

async function addMatch() {
  const d = await api('/api/admin/matches', 'POST', {
    round: Number($('a_r').value),
    opponent: $('a_o').value,
    stadium: $('a_s').value,
    matchDate: $('a_d').value,
    predictionDeadline: $('a_p').value
  });
  S.msg = d.ok ? t('done') : errText(d);
  await load();
  render();
}

async function logout() {
  localStorage.removeItem('token');
  S.token = null;
  S.me = null;
  S.preds = [];
  go('home');
}

function render() {
  renderLang();
  renderNav();
  $('app').classList.toggle('admin-mode', S.view === 'admin');
  const views = { home: renderHome, lineup: renderLineup, rank: renderRank, me: renderProfile, auth: renderAuth, admin: renderAdmin };
  $('app').innerHTML = views[S.view] ? views[S.view]() : renderHome();
  $('modal').innerHTML = renderPlayerPicker();
}

async function load() {
  const [playersRes, matchesRes, leaderRes, newsRes] = await Promise.all([
    api('/api/players'),
    api('/api/matches'),
    api('/api/leaderboard'),
    api('/api/news')
  ]);

  S.players = playersRes.players || [];
  S.matches = matchesRes.matches || [];
  S.board = leaderRes.users || [];
  S.news = newsRes.news || [];

  if (S.token) {
    const meRes = await api('/api/auth/me');
    if (meRes.ok) {
      S.me = meRes.user;
      const myPreds = await api('/api/predictions/my');
      S.preds = myPreds.predictions || [];
    } else {
      localStorage.removeItem('token');
      S.token = null;
      S.me = null;
      S.preds = [];
    }
  }

  if (S.matches.length && !S.matchId) {
    S.matchId = S.matches[0].id;
  }

  render();
}

render();
load();
</script></body></html>
